appId: vn.lunor.melorix
productName: MELORIX
electronVersion: 37.2.0
asar: true
compression: normal

directories:
  output: release

files:
  - dist/**/*
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/vst3-session.cjs
  - package.json
  - "!node_modules/**/*"
  - "!**/*.map"

extraResources:
  - from: native/bin/melorix-vst3-scan.exe
    to: vst3/melorix-vst3-scan.exe
  - from: native/bin/melorix-vst3-session.exe
    to: vst3/melorix-vst3-session.exe

win:
  icon: desktop/melorix.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: MELORIX-Setup-${version}-${arch}.${ext}

portable:
  artifactName: MELORIX-Portable-${version}-${arch}.${ext}
