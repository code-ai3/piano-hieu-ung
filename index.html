<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MELORIX – MIDI Studio & Music Visualizer. Biên tập MIDI đa track, hiệu ứng nốt rơi và xuất video MP4." />
    <meta name="author" content="MELORIX contributors (based on piano-fx by lishiyuan)" />
    <title>MELORIX | MIDI Studio & Music Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="/melorix-icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <script>
      (function () {
        var theme = null; try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
