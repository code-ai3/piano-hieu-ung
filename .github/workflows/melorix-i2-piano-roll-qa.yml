name: MELORIX I.2 Piano Roll Group Editing QA

on:
  push:
    branches:
      - feature/melorix-i2-piano-roll-group-editing
  pull_request:
    branches:
      - feature/melorix-i1-piano-roll-navigation

permissions:
  contents: read

jobs:
  piano-roll:
    name: I.2 MIDI group edits, TypeScript and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout I.2
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing app dependencies
        run: npm ci
      - name: Build, TypeScript and original regression tests
        run: npm run build
      - name: Install ephemeral Playwright Chromium driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Test real MIDI multi-selection and group editing in Chromium
        run: node tests/melorix-stage-i2-group-browser-qa.mjs
