name: MELORIX Web QA

on:
  push:
    branches:
      - fix/melorix-web-audit-round1
      - fix/melorix-web-silence-after-stop-5a
      - feature/melorix-stage-a-audio-stability
      - feature/melorix-stage-b-audio-inspector
      - feature/melorix-stage-b-per-track-inspector
      - feature/melorix-stage-c-piano-performance
      - feature/melorix-stage-d-track-fx
      - feature/melorix-stage-e-project-fx-export
      - feature/melorix-stage-f-export-validation
      - feature/melorix-stage-f2-long-render-fx-qa
      - feature/melorix-f3-export-playback-parity
      - feature/melorix-g1-audio-fidelity
      - feature/melorix-mp4-multitrack-audio
      - feature/melorix-track-select-delete
      - feature/melorix-piano-roll-draw-delete
      - feature/melorix-preserve-original-audio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    name: MIDI / audio regressions, TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test and build web only (NO Windows EXE)
        run: npm run build

  audio-chromium:
    name: Chromium browser audio signal and transport QA
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Stage A source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing source dependencies
        run: npm ci
      - name: Install ephemeral browser automation driver
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Build browser preview
        run: npm run build-only
      - name: Ensure FFmpeg and ffprobe exist on GitHub runner for MP4 QA
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Verify real WebAudio sample signal and transport in Chromium
        run: node tests/melorix-stage-a-browser-qa.mjs
      - name: Verify 3-minute WAV render memory and per-track FX A/B in Chromium
        run: node tests/melorix-stage-f2-browser-qa.mjs
      - name: Verify missing GM/WAV samples cannot silently change exported timbre
        run: node tests/melorix-stage-g-browser-qa.mjs
