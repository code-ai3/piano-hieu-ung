name: MELORIX VST3 Native Loader Probe

on:
  push:
    branches:
      - feature/melorix-vst3-host-stage2-loader
      - feature/melorix-vst3-stage3-track-instances
      - feature/melorix-vst3-stage3b-native-editor
    paths:
      - .github/workflows/melorix-vst3-host-probe.yml
      - native/vst3-host/**
      - tests/melorix-vst3-stage2.mjs
      - tests/melorix-vst3-stage3.mjs
      - tests/melorix-vst3-stage3b.mjs
      - desktop/**/*
      - src/components/MelorixVst3Browser.vue
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-vst3:
    name: Build real Steinberg SDK VST3 loader (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source restrictions before loading any plugin
        run: |
          node tests/melorix-vst3-stage2.mjs
          node tests/melorix-vst3-stage3.mjs
          node tests/melorix-vst3-stage3b.mjs
          if ($LASTEXITCODE -ne 0) { throw 'VST3 Stage 3 source regressions failed' }

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Obtain pinned MIT VST3 SDK (recursive; no Kontakt/NKI)
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'vst3sdk'
          git clone --recursive --filter=blob:none https://github.com/steinbergmedia/vst3sdk.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'VST3 SDK clone failed' }
          git -C $sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          if ($LASTEXITCODE -ne 0) { throw 'Pinned VST3 SDK checkout failed' }
          git -C $sdk submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'VST3 SDK submodules missing' }
          Write-Host "SDK pin:" (git -C $sdk rev-parse HEAD)

      - name: Configure official SDK hosting module
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'vst3sdk'
          cmake -S native/vst3-host -B native/vst3-host-build -G Ninja "-DVST3_SDK_ROOT=$sdk" -DCMAKE_BUILD_TYPE=Release -DSMTG_CREATE_PLUGIN_LINK=OFF -DMELORIX_BUILD_VST3_TEST_PLUGIN=ON -DMELORIX_BUILD_VST3_TEST_SYNTH=ON
          if ($LASTEXITCODE -ne 0) { throw 'VST3 SDK CMake failed' }

      - name: Compile MELORIX native plugin loader
        run: |
          cmake --build native/vst3-host-build --target melorix-vst3-probe --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'VST3 loader compilation failed' }

      - name: Compile native VST3 PCM renderer and QA synth plugin
        run: |
          cmake --build native/vst3-host-build --target melorix-vst3-render melorix-test-synth --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native VST3 renderer or QA instrument compilation failed' }

      - name: Prove MIDI Note On-Off was rendered by real VST3 into WAV PCM
        run: |
          $exe='native/vst3-host-build/bin/melorix-vst3-render.exe'
          if (!(Test-Path $exe)) { throw 'Missing stage 2B native renderer' }
          $plugins=@(Get-ChildItem -Path native/vst3-host-build -Recurse |
            Where-Object { $_.Name -eq 'melorix-test-synth.vst3' -and !$_.PSIsContainer -and $_.Length -gt 20000 })
          if (!$plugins.Count) { throw 'Missing real standalone MIDI VST3 test DLL' }
          $module=$plugins[0].FullName
          $wav=Join-Path $env:RUNNER_TEMP 'MELORIX-VST3-MIDI-real-PCM.wav'
          $report=& $exe --render $module $wav
          if ($LASTEXITCODE -ne 0) { throw "Native MIDI to VST3 PCM render failed: $LASTEXITCODE" }
          $data=$report | ConvertFrom-Json
          if (!$data.vst3Process -or $data.midiEvents -ne 2 -or
              $data.nonzeroSamples -lt 1000 -or $data.peak -lt 0.02 -or
              $data.tailPeak -gt 0.0001 -or $data.frames -ne 44100) {
            throw 'VST3 plugin process did not produce the expected audible PCM note and silence after MIDI Note Off'
          }
          $audio=[IO.File]::ReadAllBytes($wav)
          if ($audio.Length -ne (44 + 44100*2*2)) { throw 'WAV PCM size mismatch' }
          if ([Text.Encoding]::ASCII.GetString($audio,0,4) -ne 'RIFF') { throw 'Not WAV audio' }
          Write-Host ('PASS: MIDI -> genuine VST3 process() -> stereo PCM 44.1kHz, peak '+$data.peak)
          $global:LASTEXITCODE = 0

      - name: Build native persistent VST3 track session
        run: |
          cmake --build native/vst3-host-build --target melorix-vst3-session --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Persistent VST3 host did not compile' }

      - name: Exercise real VST3 instances per track in one persistent native process
        run: |
          $exe='native/vst3-host-build/bin/melorix-vst3-session.exe'
          if (!(Test-Path $exe)) { throw 'Missing persistent VST3 host' }
          $plugins=@(Get-ChildItem native/vst3-host-build -Recurse |
            Where-Object { $_.Name -eq 'melorix-test-synth.vst3' -and !$_.PSIsContainer -and $_.Length -gt 20000 })
          if (!$plugins.Count) { throw 'Missing real QA VST3 for persistent session' }
          $module=$plugins[0].FullName
          $commands=@(
            'PING',
            "LOAD`t1`t$module",
            "LOAD`t2`t$module",
            'LIST',
            "LOAD`t3`tZ:\NotInstalled\Kontakt.vst3",
            'LIST',
            "UNLOAD`t1",
            'LIST',
            'QUIT'
          )
          $lines=@($commands | & $exe)
          if ($LASTEXITCODE -ne 0) { throw "Persistent VST3 session exited: $LASTEXITCODE" }
          $reports=@($lines | ForEach-Object { $_ | ConvertFrom-Json })
          if ($reports.Count -ne 9) { throw "Wrong number of session responses: $($reports.Count)" }
          if (!$reports[0].ok -or $reports[0].nativeHost -ne $true) { throw 'Session ping failed' }
          if (!$reports[1].componentInitialized -or !$reports[2].componentInitialized) { throw 'Two track plugin instances did not initialize' }
          if (!$reports[3].ok -or $reports[3].tracks.Count -ne 2) { throw 'Missing independent track 1 and 2 instances' }
          if ($reports[4].ok -ne $false) { throw 'Invalid Kontakt path must be rejected' }
          if ($reports[5].tracks.Count -ne 2) { throw 'Rejected load must preserve existing VST3 tracks' }
          if (!$reports[6].removed -or $reports[7].tracks.Count -ne 1 -or
              $reports[7].tracks[0].track -ne 2) { throw 'Per-track VST3 unloading failed' }
          if ($reports[7].audioConnected -ne $false -or $reports[7].editorOpened -ne $false) {
            throw 'Stage3A may not claim Kontakt audio or UI'
          }
          Write-Host 'PASS: one native process loaded independent VST3 instances on two MIDI tracks, rejected invalid path, unloaded one without affecting the other'
          $global:LASTEXITCODE=0

      - name: Verify missing VST3 editor is handled without process crash
        run: |
          $exe='native/vst3-host-build/bin/melorix-vst3-session.exe'
          $plugins=@(Get-ChildItem native/vst3-host-build -Recurse |
            Where-Object { $_.Name -eq 'melorix-test-synth.vst3' -and !$_.PSIsContainer -and $_.Length -gt 20000 })
          $module=$plugins[0].FullName
          $commands=@("LOAD`t6`t$module","EDITOR_OPEN`t6`t0",'LIST',"EDITOR_CLOSE`t6",'QUIT')
          $raw=@($commands | & $exe)
          if ($LASTEXITCODE -ne 0) { throw "Editor fallback crashed native host: $LASTEXITCODE" }
          $v=@($raw | ForEach-Object { $_ | ConvertFrom-Json })
          if ($v.Count -ne 5 -or !$v[0].ok -or $v[1].ok -ne $false -or
              !$v[2].ok -or $v[2].tracks.Count -ne 1 -or !$v[3].ok) {
            throw 'Editor unavailable must be reported without losing track'
          }
          Write-Host 'PASS: VST3 without native editor fails safely, component remains loaded'

      - name: Build genuine Steinberg ADelay VST3 test effect
        run: |
          cmake --build native/vst3-host-build --target adelay --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg ADelay VST3 test plugin build failed' }

      - name: Verify isolated host rejects an invalid VST3 path
        run: |
          $exe = 'native/vst3-host-build/bin/melorix-vst3-probe.exe'
          if (!(Test-Path $exe)) { throw 'Missing built native loader' }
          $output = & $exe --inspect 'Z:\NoSuchPlugin\Kontakt.vst3'
          if ($LASTEXITCODE -ne 3) { throw "Incorrect invalid-plugin exit: $LASTEXITCODE" }
          $message = $output | ConvertFrom-Json
          if ($message.ok -ne $false -or $message.schema -ne 2) { throw 'Invalid error JSON contract' }
          Write-Host 'PASS: SDK loader compiled; invalid VST3 is not launched'
          $global:LASTEXITCODE = 0

      - name: Test loading and initializing genuine Steinberg ADelay VST3
        run: |
          $exe='native/vst3-host-build/bin/melorix-vst3-probe.exe'
          $plugins=@(Get-ChildItem -Path native/vst3-host-build -Recurse |
            Where-Object { $_.Name -eq 'adelay.vst3' -and !$_.PSIsContainer -and $_.Length -gt 20000 })
          if (!$plugins.Count) { throw 'Missing ADelay VST3 bundle from Steinberg SDK' }
          $module=$plugins[0].FullName
          $inspect=& $exe --inspect $module
          if ($LASTEXITCODE -ne 0) { throw "Real ADelay inspect failed: $LASTEXITCODE" }
          $data=$inspect | ConvertFrom-Json
          if (!$data.ok -or $data.factoryClasses -lt 1 -or $data.audioRendered) {
            throw 'Real VST3 factory enumeration failed'
          }
          Write-Host ('PASS: VST3 module was really loaded; factory has '+$data.factoryClasses+' classes')
          $init=& $exe --initialize $module
          if ($LASTEXITCODE -ne 0) { throw "Real ADelay initialize failed: $LASTEXITCODE" }
          $result=$init | ConvertFrom-Json
          if (!$result.componentInitialized -or !$result.audioProcessorInterface -or $result.audioRendered) {
            throw 'Real Steinberg plugin did not initialize its IAudioProcessor'
          }
          Write-Host 'PASS: Steinberg ADelay IComponent initialized and released, but no sound or Kontakt UI'
          $global:LASTEXITCODE = 0

      - name: Upload persistent VST3 track session (engineering only)
        uses: actions/upload-artifact@v4
        with:
          name: MELORIX-VST3-stage3-track-session-NOT-RELEASE
          path: native/vst3-host-build/bin/melorix-vst3-session.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload host probe for engineering QA (not MELORIX release)
        uses: actions/upload-artifact@v4
        with:
          name: MELORIX-VST3-loader-probe-x64-NOT-RELEASE
          path: native/vst3-host-build/bin/melorix-vst3-probe.exe
          retention-days: 7
          if-no-files-found: error
